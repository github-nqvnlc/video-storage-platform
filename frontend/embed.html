<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windy Video Player Embed</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
    }
    .loading-spinner {
      position: absolute;
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
      z-index: 10;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
</head>
<body>

  <div class="video-wrapper">
    <div class="loading-spinner" id="spinner"></div>
    <video id="embedPlayer" playsinline></video>
  </div>

  <script>
    (async function () {
      const urlParams = new URLSearchParams(window.location.search);
      const videoId = urlParams.get('v') || urlParams.get('id');
      const isAutoplay = urlParams.get('autoplay') === '1' || urlParams.get('autoplay') === 'true';
      const isMuted = urlParams.get('muted') === '1' || urlParams.get('muted') === 'true';
      const isControls = urlParams.get('controls') !== '0' && urlParams.get('controls') !== 'false';
      const loopType = urlParams.get('loop'); // 'infinite', 'count', hoặc undefined
      const maxLoopCount = parseInt(urlParams.get('loopCount'), 10) || (loopType === 'infinite' ? -1 : 1);

      const video = document.getElementById('embedPlayer');
      const spinner = document.getElementById('spinner');

      if (!video) return;

      if (isControls) video.setAttribute('controls', 'controls');
      if (isMuted || isAutoplay) video.muted = true; // Trình duyệt yêu cầu muted để autoplay

      let currentLoop = 1;

      // Xử lý sự kiện khi video kết thúc (Loop logic chạy ngầm êm ả)
      video.addEventListener('ended', () => {
        if (loopType === 'infinite' || maxLoopCount === -1) {
          currentLoop++;
          video.play().catch(() => {});
        } else if (currentLoop < maxLoopCount) {
          currentLoop++;
          video.play().catch(() => {});
        }
      });

      if (!videoId) {
        document.body.innerHTML = '<div style="color:#ef4444;text-align:center;padding:20px;">Vui lòng cung cấp Video ID (?v=...)</div>';
        return;
      }

      if (spinner) spinner.style.display = 'block';

      try {
        // Lấy thông tin video từ API
        const res = await fetch(`/api/v1/videos/${videoId}`);
        const data = await res.json();
        if (spinner) spinner.style.display = 'none';

        if (!res.ok || !data.data || !data.data.hlsMasterUrl) {
          throw new Error('Video chưa sẵn sàng hoặc không tồn tại');
        }

        let streamUrl = data.data.hlsMasterUrl;

        // Chuẩn hóa domain stream sang Origin hiện tại của trình duyệt
        try {
          const parsed = new URL(streamUrl);
          const currentOrigin = new URL(window.location.origin);
          if (parsed.hostname !== currentOrigin.hostname) {
            parsed.protocol = currentOrigin.protocol;
            parsed.host = currentOrigin.host;
            parsed.port = currentOrigin.port;
            streamUrl = parsed.toString();
          }
        } catch (e) {}

        if (window.Hls && Hls.isSupported()) {
          const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            if (isAutoplay) {
              video.play().catch(e => console.warn('Autoplay blocked:', e));
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
          video.addEventListener('loadedmetadata', () => {
            if (isAutoplay) video.play().catch(() => {});
          });
        }
      } catch (err) {
        if (spinner) spinner.style.display = 'none';
        document.body.innerHTML = `<div style="color:#f87171;text-align:center;padding:20px;font-size:14px;">${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
